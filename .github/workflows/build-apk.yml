name: Build APK from ZIP

on:
  # 手动触发（可指定 ZIP 文件名）
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'ZIP 文件名（根目录下的，如 myapp.zip）'
        required: false
        default: ''
  # 推送时自动检测根目录的 .zip 文件
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------- 1. 定位并解压 ZIP ----------
      - name: Locate and unzip
        id: unzip
        run: |
          ZIP="${{ github.event.inputs.zip_file }}"
          if [ -z "$ZIP" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "❌ 未找到有效的 ZIP 文件"
            exit 1
          fi
          echo "✅ 使用 ZIP: $ZIP"
          unzip -o "$ZIP" -d .

      # ---------- 2. 可选：替换 QuantApp.kt ----------
      - name: Replace QuantApp.kt if exists
        run: |
          if [ -f ./QuantApp.kt ]; then
            TARGET=$(find . -maxdepth 3 -path "*/app/src/main/java/com/quant/app/ui/QuantApp.kt" 2>/dev/null | head -1)
            if [ -n "$TARGET" ]; then
              cp -v ./QuantApp.kt "$TARGET"
              echo "✅ 已覆盖"
            fi
          fi

      # ---------- 3. 设置 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 4. 缓存 Android SDK（加速） ----------
      - 姓名: 缓存Android SDK
uses: 操作/缓存@v4
和……一起:
路径: /usr/local/lib/android/sdk
钥匙: android-sdk-${{runner.os}}

      #----------5.安装SDK-----------
      - 姓名: 安装Android SDK
uses: android-actions/setup-android@v3

      - 姓名: 安装SDK组件
跑: |
yes|sdkmanager--licenses>/dev/null||true
sdkmanager"平台；android-35""构建工具；35.0.0""平台工具"

      #----------6.缓存Gradle（加速）----------
      - 姓名: 缓存渐变
uses: 操作/缓存@v4
和……一起:
路径: |
~/.gradle/caches/
~/.gradle/wrapper/
钥匙: gradle-${{runner.os}}-${{哈希文件('**/*.gradle*', '**/gradle-wrapper.properties') }}
还原键: gradle-${{runner.os}}

      #----------7.设置8.9级-----------
      - 姓名: 设置渐变
uses: gradle/操作/设置-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------- 8. 构建 APK ----------
      - name: Build APK
        id: build
        run: |
          set -e
          # 自动定位工程根目录
          ROOT="."
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ROOT=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -printf "%h\n" | head -1)
          fi
          if [ -z "$ROOT" ]; then
            echo "❌ 未找到 Android 工程"
            exit 1
          fi
          echo "✅ 工程根目录: $ROOT"
          cd "$ROOT"

          rm -rf .gradle
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --refresh-dependencies
          else
            gradle clean assembleDebug --stacktrace --refresh-dependencies
          fi

          APK=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未生成 APK"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"
          echo "✅ APK 准备完成"

      # ---------- 9. 上传 APK（唯一产出物） ----------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
if-no-files-found:error
