name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'ZIP文件名（根目录下的，如myapp.zip）'
        required: false
        default: ''
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate and unzip
        id: unzip
        run: |
          ZIP="${{ github.event.inputs.zip_file }}"
          if [ -z "$ZIP" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "❌ 未找到有效的 ZIP 文件"
            exit 1
          fi
          echo "✅ 使用 ZIP: $ZIP"
          unzip -o "$ZIP" -d .

      - name: Replace QuantApp.kt if exists
        run: |
          if [ -f ./QuantApp.kt ]; then
            TARGET=$(find . -maxdepth 3 -path "*/app/src/main/java/com/quant/app/ui/QuantApp.kt" 2>/dev/null | head -1)
            if [ -n "$TARGET" ]; then
              cp -v ./QuantApp.kt "$TARGET"
              echo "✅ 已覆盖"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build
        run: |
          set -e
          ROOT="."
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ROOT=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -printf "%h\n" | head -1)
          fi
          if [ -z "$ROOT" ]; then
            echo "❌ 未找到 Android 工程"
            exit 1
          fi
          echo "✅ 工程根目录: $ROOT"
          cd "$ROOT"
          rm -rf .gradle
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --refresh-dependencies
          else
            gradle clean assembleDebug --stacktrace --refresh-dependencies
          fi
          APK=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未生成 APK"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"
          echo "✅ APK 准备完成"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
